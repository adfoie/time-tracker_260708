/* 荧光光晕贴图：径向渐变 + 十字星芒（参考真实星光） */
function makeGlow(hex, size, spikes){
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const g=cv.getContext('2d');
  const grad=g.createRadialGradient(64,64,0,64,64,62);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.10,hexToRgba(hex,1));
  grad.addColorStop(0.30,hexToRgba(hex,0.55));
  grad.addColorStop(0.55,hexToRgba(hex,0.22));
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad; g.fillRect(0,0,128,128);
  if(spikes){
    g.globalCompositeOperation='lighter';
    g.strokeStyle='rgba(255,255,255,0.95)';
    g.lineWidth=1.4;
    g.beginPath();
    g.moveTo(64,0); g.lineTo(64,128);
    g.moveTo(0,64); g.lineTo(128,64);
    g.stroke();
    g.strokeStyle=hexToRgba(hex,0.6);
    g.lineWidth=3.2;
    g.beginPath();
    g.moveTo(64,14); g.lineTo(64,114);
    g.moveTo(14,64); g.lineTo(114,64);
    g.stroke();
  }
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  sp.scale.set(size,size,1);
  return sp;
}

  g.shadowColor='rgba(0,0,0,.9)'; g.shadowBlur=8;
  g.fillStyle = isMe ? '#A9D0FF' : '#D8DCE6';

  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  sp.scale.set(26,6.5,1);
  return sp;
}

// ★ 在 applyRel 函数上方定义配置
const GLOW_CONFIG = {
  // 高亮连线
  highlight: {
    color: 0xC78BFF,
    opacity: 0.92,
    glowColor: 0xA855F7,
    glowOpacity: 0.4,
    glowSize: 6,
  },
  // 背景连线
background: {
  color: 0x2E7CF6,   // 电蓝色，而不是灰色
  opacity: 0.45,
},
  // 光晕 Sprite 设置
  sprite: {
    enabled: true,
    size: 6,
    opacity: 0.4,
  }
};

function applyRel(){
  // 清除旧的光晕
  if(P.glowObjects) {
    P.glowObjects.forEach(obj => P.group.remove(obj));
    P.glowObjects = [];
  }
  
  const glowObjects = [];
  
  (P.lines||[]).forEach(ln=>{
    const m=ln.material;
    const rel = ln.userData.rel;
    
    if(P.rel === 'all'){
      // 所有关系都显示，但不同关系用不同颜色
      if(rel === 'in'){
        m.color.set(0x6FA8FF);   // 蓝色：关注我的
        m.opacity=0.8;
        m.blending=THREE.AdditiveBlending;
      } else if(rel === 'out'){
        m.color.set(0xB0B8C8);   // 银灰色：我关注的
        m.opacity=0.8;
        m.blending=THREE.AdditiveBlending;
// applyRel 里 'all' 分支的 else（对应 rel==='other'）替换：
     } else {
       m.color.set(0x2E7CF6);   // 电蓝色：普通关系线也发光
       m.opacity=0.5;
       m.blending=THREE.AdditiveBlending;
     }
      
      // ★ 为关注关系添加光晕
      if(GLOW_CONFIG.sprite.enabled && (rel === 'in' || rel === 'out')){
        const color = rel === 'in' ? 0x6FA8FF : 0xB0B8C8;
        addGlowSpriteToLine(ln, glowObjects, color, GLOW_CONFIG.sprite.opacity, GLOW_CONFIG.sprite.size);
      }
      
    } else {
      const lit = rel === P.rel;
      if(lit){ 
        m.color.set(GLOW_CONFIG.highlight.color); 
        m.opacity = GLOW_CONFIG.highlight.opacity; 
        m.blending = THREE.AdditiveBlending;
        
        // ★ 为高亮连线添加光晕
        if(GLOW_CONFIG.sprite.enabled){
          addGlowSpriteToLine(ln, glowObjects, GLOW_CONFIG.highlight.glowColor, GLOW_CONFIG.highlight.glowOpacity, GLOW_CONFIG.highlight.glowSize);
        }
        
      } else { 
        m.color.set(GLOW_CONFIG.background.color); 
        m.opacity = GLOW_CONFIG.background.opacity; 
        m.blending = THREE.NormalBlending; 
      }
    }
    m.needsUpdate=true;
  });
  
  P.glowObjects = glowObjects;
  
  // 更新按钮状态
  [['plRelIn','in'],['plRelOut','out'],['plRelAll','all']].forEach(([id,v])=>{
    const el=$(id); if(el) el.classList.toggle('on', P.rel===v);
  });
}

// ★ 辅助函数
function addGlowSpriteToLine(ln, glowObjects, color, opacity, size){
  const pos = ln.geometry.attributes.position;
  if(pos && pos.count === 2){
    const midX = (pos.getX(0) + pos.getX(1)) / 2;
    const midY = (pos.getY(0) + pos.getY(1)) / 2;
    const midZ = (pos.getZ(0) + pos.getZ(1)) / 2;
    
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const hex = '#' + color.toString(16).padStart(6, '0');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, hex + 'ff');
    gradient.addColorStop(0.3, hex + '88');
    gradient.addColorStop(0.7, hex + '33');
    gradient.addColorStop(1, hex + '00');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    
    const texture = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: opacity,
    });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.position.set(midX, midY, midZ);
    sprite.scale.set(size || 6, size || 6, 1);
    P.group.add(sprite);
    glowObjects.push(sprite);
  }
}


     
function animatePlanet(){
  if(!P.on) return;
  const t=performance.now()/1000;
  P.nodes.forEach(g=>{
    if(g===P.dragGrp) return;                    // 被拖动的节点不漂浮
    g.position.y = g.userData.baseY + Math.sin(t*0.55 + g.userData.phase)*2.0;
  });
  P.lines.forEach(ln=>{
    ln.geometry.setFromPoints([ln.userData.a.position.clone(), ln.userData.b.position.clone()]);
  });
  if(!P.rotating && !P.dragGrp && !P.pinch) P.group.rotation.y += 0.0011;
  P.renderer.render(P.scene, P.camera);
  P.raf=requestAnimationFrame(animatePlanet);
}
function bindPlanetInput(cvs){
  const ray=new THREE.Raycaster(), v2=new THREE.Vector2();
  const tmpV=new THREE.Vector3(), plane=new THREE.Plane();
  const ptrs=new Map();
  let sx=0, sy=0, moved=0, hitNode=null, pinchD=0, panLast=null;
  const toNDC=(x,y)=>{
    const r=cvs.getBoundingClientRect();
    v2.x=((x-r.left)/r.width)*2-1;
    v2.y=-((y-r.top)/r.height)*2+1;
  };
  const pick=(x,y)=>{
    toNDC(x,y);
    ray.setFromCamera(v2, P.camera);
    const hits=ray.intersectObjects(P.nodes.map(g=>g.userData.mesh));
    return hits.length ? hits[0].object.parent : null;
  };
  cvs.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    cvs.setPointerCapture(e.pointerId);
  if(ptrs.size===2){                             // 双指缩放/平移开始
      const [a,b]=[...ptrs.values()];
      pinchD=Math.hypot(a.x-b.x,a.y-b.y);
      panLast={x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      P.pinch=true; P.rotating=false; P.dragGrp=null;
      return;
    }
    sx=e.clientX; sy=e.clientY; moved=0;
    hitNode=pick(e.clientX,e.clientY);
    P.dragGrp = hitNode || null;
    P.rotating = !hitNode;
  });
  cvs.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.pinch && ptrs.size===2){                  // 双指缩放 + 平移
      const [a,b]=[...ptrs.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinchD>0){
        P.camera.position.z=Math.max(55, Math.min(400, P.camera.position.z*pinchD/d));
      }
      pinchD=d;
      const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;         // 双指整体移动 → 平移视角，不再锁死在"我"的位置
      if(panLast){
        const dx=cx-panLast.x, dy=cy-panLast.y;
        const panScale=P.camera.position.z*0.0016;  // 离得越远，平移越快，手感一致
        P.camera.position.x -= dx*panScale;
        P.camera.position.y += dy*panScale;
      }
      panLast={x:cx,y:cy};
      return;
    }
    const dx=e.clientX-sx, dy=e.clientY-sy;
    moved=Math.max(moved, Math.abs(dx)+Math.abs(dy));
    if(P.dragGrp){                                 // 拖动节点：连线自动跟随
      toNDC(e.clientX,e.clientY);
      ray.setFromCamera(v2, P.camera);
      P.dragGrp.getWorldPosition(tmpV);
      plane.setFromNormalAndCoplanarPoint(
        P.camera.getWorldDirection(new THREE.Vector3()).negate(), tmpV);
      const hitP=new THREE.Vector3();
      if(ray.ray.intersectPlane(plane, hitP)){
        P.group.worldToLocal(hitP);
        P.dragGrp.position.copy(hitP);
        P.dragGrp.userData.baseY=hitP.y;
      }
    } else if(P.rotating){                         // 拖动空白：旋转星系
      P.group.rotation.y += dx*0.005;
      P.group.rotation.x = Math.max(-0.9, Math.min(0.9, P.group.rotation.x + dy*0.003));
      sx=e.clientX; sy=e.clientY;
    }
  });
    const up=e=>{
       ptrs.delete(e.pointerId);
       if(ptrs.size<2){ P.pinch=false; panLast=null; }
       if(ptrs.size>0) return;
       if(moved<8 && hitNode){                        // 轻点节点：看公开 idea（含自己）
         const u=hitNode.userData.mesh.userData;
         openSoc('person',{uid:u.uid, nm:u.nm});
       } else if(moved>=8 && hitNode){                 // 拖动结束：记住新位置，走云同步
         const u=hitNode.userData.mesh.userData;
         if(!S.planetPos) S.planetPos={};
         S.planetPos[u.uid]=[hitNode.position.x, hitNode.position.y, hitNode.position.z];
         save();                                       // 本地写入 + 自动排队推送到 Supabase
       }
       P.dragGrp=null; P.rotating=false; hitNode=null;
     };
  cvs.addEventListener('pointerup',up);
  cvs.addEventListener('pointercancel',up);
  cvs.addEventListener('wheel',e=>{                // 电脑滚轮缩放
    e.preventDefault();
    P.camera.position.z=Math.max(55, Math.min(400, P.camera.position.z*(e.deltaY>0?1.08:0.93)));
  },{passive:false});
  cvs.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ═══════════ 存储诊断（整包体积） ═══════════ */
function showStorageStats(){
  const bytesOf = v => new Blob([JSON.stringify(v ?? null)]).size;
  const fmt = n => n>=1048576 ? (n/1048576).toFixed(2)+' MB'
               : n>=1024    ? (n/1024).toFixed(1)+' KB'
               : n+' B';
  const nameMap = {
    recs:'⏱️ 时间记录', cats:'🏷️ 分类',
    diary:'📔 日记(旧)', dayDiary:'📔 每日日记', weekDiary:'📔 周日记',
    todos:'✅ 待办',
    psNodes:'🧠 个人系统·节点', psLinks:'🧠 个人系统·连线', psGroups:'🧠 个人系统·组',
    psAIChat:'🤖 AI对话历史',
    planetPos:'🪐 星球相机位', msgSeenAt:'消息已读', mode:'设置·模式'
  };
  const total = bytesOf(S);
  const rows = Object.keys(S).map(k=>{
    const v=S[k], b=bytesOf(v);
    let scale='';
    if(Array.isArray(v)) scale=v.length+' 项';
    else if(v && typeof v==='object') scale=Object.keys(v).length+' 键';
    return { name:(nameMap[k]||k), b, pct:total?(b/total*100):0, scale };
  }).sort((a,b)=>b.b-a.b);

  // 本机 localStorage 实际占用（当前账号槽）
  let lsBytes=0;
  try{ const raw=localStorage.getItem(lsKeyFor(curUid)); lsBytes = raw? new Blob([raw]).size : 0; }catch(e){}

  // 预警
  const warn=[];
  if(total>1048576) warn.push('⚠️ 整包已超过 1MB：整包同步会明显变慢，建议尽快做归档或增量同步。');
  else if(total>512*1024) warn.push('⚠️ 整包超过 512KB：进入需要关注的区间，可以开始规划归档。');
  else warn.push('✅ 整包体积还很轻松，暂时无需改动数据层。');
  const psB=bytesOf(S.psNodes)+bytesOf(S.psLinks)+bytesOf(S.psGroups);
  if(bytesOf(S.recs)>total*0.4) warn.push('· 时间记录占比最高，将来最该做时间归档（它随天数无限增长）。');
  if(psB>total*0.4) warn.push('· 个人系统占比很高，将来分表时它是主要对象。');
  if(bytesOf(S.psAIChat)>60*1024) warn.push('· AI对话历史偏大，可缩短保留天数或降低条数上限。');

  const barColor = total>1048576?'#C0392B':total>512*1024?'#B4530A':'#2E9E63';
  const rowsHTML = rows.filter(r=>r.b>0).map(r=>`
    <div style="margin:9px 0">
      <div style="display:flex;justify-content:space-between;font-size:13px;line-height:1.4">
        <span>${r.name}${r.scale?` <span style="opacity:.5">· ${r.scale}</span>`:''}</span>
        <span style="opacity:.7;white-space:nowrap">${fmt(r.b)} · ${r.pct.toFixed(1)}%</span>
      </div>
      <div style="height:6px;border-radius:4px;background:rgba(0,0,0,.07);margin-top:4px;overflow:hidden">
        <div style="height:100%;width:${Math.max(r.pct,1.5)}%;background:${barColor};border-radius:4px"></div>
      </div>
    </div>`).join('');

  const ov=document.createElement('div');
  ov.className='overlay show';
  ov.style.zIndex=72;
  ov.style.alignItems='center';
  ov.innerHTML=`<div class="tagmenu" style="max-width:420px;width:88%;max-height:82vh;overflow:auto;text-align:left">
    <div class="tmtitle" style="text-align:center">存储诊断</div>
    <div style="text-align:center;font-size:22px;font-weight:800;color:${barColor};margin:2px 0 2px">${fmt(total)}</div>
    <div style="text-align:center;font-size:12px;opacity:.6;margin-bottom:12px">
      整包 ${total.toLocaleString()} 字节 · 本机存档 ${fmt(lsBytes)}
    </div>
    ${rowsHTML}
    <div style="font-size:12px;line-height:1.7;opacity:.85;margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)">
      ${warn.join('<br>')}
    </div>
    <div class="btns" style="margin-top:14px">
      <button data-a="copy">复制明细</button>
      <button data-a="x">关闭</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onclick=e=>{ if(e.target===ov) close(); };
  ov.querySelector('[data-a="x"]').onclick=close;
  ov.querySelector('[data-a="copy"]').onclick=()=>{
    const txt='整包总体积 '+fmt(total)+' ('+total+' 字节)\n本机存档 '+fmt(lsBytes)+'\n\n'
      + rows.filter(r=>r.b>0).map(r=>`${r.name}  ${fmt(r.b)}  ${r.pct.toFixed(1)}%  ${r.scale}`).join('\n');
    try{ navigator.clipboard.writeText(txt); toast('已复制'); }catch(e){ toast('复制失败'); }
  };
}

    close();
    if(!await uiConfirm('确定清除当前全部数据并替换？此操作不可恢复')) return;
    S = ensureDefaults({cats:d.cats, recs:d.recs, diary:d.diary||{}, dayDiary:d.dayDiary||{}, todos:d.todos||{}, weekDiary:d.weekDiary||{}, mode:S.mode});
    save(); renderAll(); renderMe(); toast('已全部覆盖导入');
  };
  ov.querySelector('[data-a="merge"]').onclick=()=>{
    close();
    const n=mergeImport(d);
    save(); renderAll(); renderMe();
    toast(n?('合并完成：填补了 '+n+' 天的记录'):'合并完成：没有需要填补的日期');
  };
}
function mergeImport(d){
  /* 标签合并：id 相同沿用；同名不同 id 重映射；全新标签加入 */
  const remap={};
  (d.cats||[]).forEach(c=>{
    if(catById(c.id)) return;
    const same=S.cats.find(x=>x.name===c.name);
    if(same){ remap[c.id]=same.id; return; }
    S.cats.push(c);
  });
  const fix=cat=>(cat&&remap[cat])?remap[cat]:cat;
  let added=0;
  Object.keys(d.recs||{}).forEach(k=>{
    if(S.recs[k] && S.recs[k].length) return;      // 已有记录的日期：不动
    const day=(d.recs[k]||[]).map(r=>({...r, cat:fix(r.cat)}));
    if(day.length){ S.recs[k]=day; added++; }
  });
  Object.keys(d.todos||{}).forEach(k=>{
    if(S.todos[k] && S.todos[k].length) return;
    if((d.todos[k]||[]).length) S.todos[k]=d.todos[k];
  });
  Object.keys(d.dayDiary||{}).forEach(k=>{
    const cur=S.dayDiary[k];
    if(cur && ((cur.text&&cur.text.trim())||cur.mood)) return;
    S.dayDiary[k]=d.dayDiary[k];
  });
  Object.keys(d.diary||{}).forEach(k=>{
    if(S.diary[k] && S.diary[k].trim()) return;
    S.diary[k]=d.diary[k];
  });
  Object.keys(d.weekDiary||{}).forEach(k=>{
    if(S.weekDiary[k] && S.weekDiary[k].trim()) return;
    S.weekDiary[k]=d.weekDiary[k];
  });
  return added;
}

/* ── 个人系统撤销/重做（快照历史）── */let psHist={ stack:[], idx:-1 };
function psSnapshot(){
  return JSON.stringify({ n:S.psNodes||{}, l:S.psLinks||[], g:S.psGroups||[] });
}
function psHistInit(){
  psHist.stack=[psSnapshot()]; psHist.idx=0;
}
function psHistPush(){
  const snap=psSnapshot();
  if(psHist.stack[psHist.idx]===snap) return;   // 与栈顶相同不重复记录
  psHist.stack=psHist.stack.slice(0, psHist.idx+1);
  psHist.stack.push(snap);
  if(psHist.stack.length>50) psHist.stack.shift();
  psHist.idx=psHist.stack.length-1;
}
// 离散操作用：保存 + 记一次历史快照
function psSave(){ save(); psHistPush(); }
function psHistApply(){
  const snap=psHist.stack[psHist.idx];
  if(!snap) return;
  const o=JSON.parse(snap);
  S.psNodes=o.n; S.psLinks=o.l; S.psGroups=o.g;
  save(); renderPSGraph();
  // 若卡片编辑弹窗开着，同步刷新正文/标题
  if(PS.sel && $('psCardWrap') && $('psCardWrap').style.display!=='none'){
    const n=psNode(PS.sel);
    const a=$('psA'), q=$('psQ');
    if(n && a) a.innerHTML=n.a||'';
    if(n && q) q.value=n.q||'';
  }
}
function psUndo(){ if(psHist.idx>0){ psHist.idx--; psHistApply(); } }
function psRedo(){ if(psHist.idx<psHist.stack.length-1){ psHist.idx++; psHistApply(); } }

// 当前选中：节点集合 PS.selNodes，或单个组 PS.selGroup
function psShowTools(){
  const bar=$('psTools'); if(!bar) return;
  const hasNodes = PS.selNodes && PS.selNodes.size>0;
  const hasGroup = PS.selGroup!=null;
  if(!hasNodes && !hasGroup){ bar.style.display='none'; return; }
  // 计算选中区域的屏幕包围盒（取选中项在屏幕上的位置，工具条放其上方）
  const V=PS.view;
  let minx=1e9,miny=1e9,maxx=-1e9;
  const acc=(x,y)=>{ const sx=x*V.scale+V.x, sy=y*V.scale+V.y; minx=Math.min(minx,sx);miny=Math.min(miny,sy);maxx=Math.max(maxx,sx); };
  if(hasNodes){ PS.selNodes.forEach(id=>{ const n=psNode(id); if(n) acc(n.x,n.y); }); }
  if(hasGroup){ const gb=(PS._groupBoxes||[])[PS.selGroup]; if(gb){ acc(gb.minx,gb.miny); acc(gb.maxx,gb.miny); } }
  if(minx>maxx){ bar.style.display='none'; return; }
  // 按钮：删除 / 调色 / 聚焦 / 打组或解散 / 组管理
  let btns='';
  if(hasGroup){
    // 选中组：删除=解散组
    btns=`<button data-act="del">🗑 解散</button><button data-act="color">🎨 调色</button><button data-act="focus">🎯 聚焦</button><button data-act="mgr">👁 组管理</button>`;
  } else {
    // 选中节点：删除=删节点，可打组
    btns=`<button data-act="del">🗑 删除</button><button data-act="color">🎨 调色</button><button data-act="focus">🎯 聚焦</button><button data-act="group">📦 打组</button>`;
  }
  bar.innerHTML=btns;
  bar.style.display='flex';
  // 定位：选中区域上方居中
  const bw=bar.offsetWidth||240;
  let left=(minx+maxx)/2 - bw/2;
  let top=miny - 52;
  left=Math.max(8, Math.min(left, (($('psGraph').clientWidth)||360)-bw-8));
  if(top<50) top=50;
  bar.style.left=left+'px'; bar.style.top=top+'px';
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>psToolAction(b.dataset.act));
}
async function psToolAction(act){
  if(act==='del'){
    if(PS.selGroup!=null){
      // 解散组（不删节点）
      const gi=PS.selGroup;
      S.psLinks=(S.psLinks||[]).filter(l=>l.fromG!==gi && l.toG!==gi);
      (S.psLinks||[]).forEach(l=>{ if(l.fromG!=null&&l.fromG>gi)l.fromG--; if(l.toG!=null&&l.toG>gi)l.toG--; });
      S.psGroups.splice(gi,1); PS.selGroup=null; psSave(); renderPSGraph(); psShowTools();
    } else if(PS.selNodes){
      if(await uiConfirm(`删除选中的 ${PS.selNodes.size} 个节点？`)){
        PS.selNodes.forEach(id=>psDeleteNode(id));
        PS.selNodes=null; psSave(); renderPSGraph(); psShowTools();
      }
    }
    return;
  }
  if(act==='color'){
    const c=await uiColor('选择颜色', '#4A90E2');
    if(!c) return;
    if(PS.selGroup!=null){ (S.psGroups[PS.selGroup].ids||[]).forEach(id=>{ const n=psNode(id); if(n) n.color=c; }); }
    else if(PS.selNodes){ PS.selNodes.forEach(id=>{ const n=psNode(id); if(n) n.color=c; }); }
    psSave(); renderPSGraph();
    return;
  }
  if(act==='focus'){ psFocusSelection(); return; }
  if(act==='group'){
    if(PS.selNodes && PS.selNodes.size){
      S.psGroups=S.psGroups||[];
      S.psGroups.push({name:'组', ids:[...PS.selNodes]});
      const gi=S.psGroups.length-1;
      PS.selNodes=null; PS.selGroup=gi;   // 打组后切换为选中该组
      psSave(); renderPSGraph(); psShowTools();
    }
    return;
  }
  if(act==='mgr'){ openGroupMgr(); return; }
}
// 聚焦：把选中项缩放平移到视图中央
function psFocusSelection(){
  const wrap=$('psGraph'); const W=wrap.clientWidth||360, H=wrap.clientHeight||420;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  const acc=(x,y)=>{ minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y); };
  if(PS.selGroup!=null){ const gb=(PS._groupBoxes||[])[PS.selGroup]; if(gb){ acc(gb.minx,gb.miny); acc(gb.maxx,gb.maxy); } }
  else if(PS.selNodes){ PS.selNodes.forEach(id=>{ const n=psNode(id); if(n){ acc(n.x-80,n.y-60); acc(n.x+80,n.y+60); } }); }
  if(minx>maxx) return;
  const bw=maxx-minx||1, bh=maxy-miny||1;
  const scale=Math.min(W/bw, H/bh, 2)*0.8;
  PS.view.scale=Math.max(0.3,Math.min(scale,4));
  PS.view.x = W/2 - (minx+maxx)/2*PS.view.scale;
  PS.view.y = H/2 - (miny+maxy)/2*PS.view.scale;
  renderPSGraph(); psShowTools();
}

// 调用 Edge Function（函数名 ask-ai；入参 {messages}；出参 {text}）
async function psCallAI(messages){
  const url = `${SUPABASE_URL}/functions/v1/ask-ai`;
  // 优先用当前登录用户的 access_token；取不到再回退 anon key
  let token = SUPABASE_ANON_KEY;
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.access_token) token = data.session.access_token;
  }catch(_){}
  const r = await fetch(url, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${token}`,
      'apikey':SUPABASE_ANON_KEY
    },
    body:JSON.stringify({ messages })
  });
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{ const j=await r.json(); if(j.error||j.message) msg=(j.error||j.message); }catch(_){}
    throw new Error(msg);
  }
  const data=await r.json();
  return data.text || '';
}

// —— AI 对话历史（近一周作为背景）——
const PS_AI_HIST_DAYS = 7;                 // 参考最近多少天的对话
const PS_AI_HIST_MAX  = 20;                 // 最多带入多少条历史消息，防止上下文过长
function psAIRecord(role, content){
  if(!Array.isArray(S.psAIChat)) S.psAIChat=[];
  S.psAIChat.push({ role, content:String(content||''), t:Date.now() });
  // 顺手清理超过 30 天的老记录，避免无限增长
  const cutoff=Date.now()-30*24*3600*1000;
  S.psAIChat=S.psAIChat.filter(m=>m.t>=cutoff);
  save();
}
// 取近一周的对话历史，转成给模型的 messages（按时间正序，最多 PS_AI_HIST_MAX 条）
function psAIRecentHistory(){
  const since=Date.now()-PS_AI_HIST_DAYS*24*3600*1000;
  const recent=(S.psAIChat||[]).filter(m=>m.t>=since && (m.role==='user'||m.role==='assistant'));
  const tail=recent.slice(-PS_AI_HIST_MAX);
  return tail.map(m=>({ role:m.role, content:m.content }));
}

async function psAskAI(userPrompt){

  // 系统提示：要求 AI 用固定 JSON 结构返回“新节点群”，便于解析成预览

  // 组装 messages：system → 近一周历史对话 → 本次需求
  const history = psAIRecentHistory();
  const messages = [{role:'system', content:sys}, ...history, {role:'user', content:usr}];
  // 记录本次用户提问到历史（背景以完整需求文本入库，便于下次连贯）
  psAIRecord('user', usr);
  try{
    const raw = await psCallAI(messages);
    // 记录 AI 回复到历史（作为下一次的近一周背景）
    psAIRecord('assistant', raw);
    // 尝试解析 JSON（容错：剥掉可能的代码块围栏）
    let txt=raw.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    let parsed=null;
    try{ parsed=JSON.parse(txt); }catch(_){
      // 再尝试抓第一个 { ... }
      const m=txt.match(/\{[\s\S]*\}/); if(m){ try{ parsed=JSON.parse(m[0]); }catch(__){} }
    }
    if(parsed && Array.isArray(parsed.nodes) && parsed.nodes.length){
      psRenderAIPreview(parsed.nodes);
    } else {
      // 不是结构化结果，就当普通回答展示
      body.innerHTML = `<div class="psai-answer">${escHtml(raw)}</div>`;
    }
  }catch(err){
    body.innerHTML = `<div class="psai-err">调用失败：${escHtml(err.message||String(err))}<br><span style="opacity:.7">检查 Edge Function（ask-ai）是否部署、DEEPSEEK_API_KEY 是否已配置。</span></div>`;
  }
}

// 预览区：展示 AI 生成的新节点群，可勾选后采纳
// 纯文本安全转 HTML：用 DOM 转义特殊字符，换行转 <br>（与 contenteditable 格式一致）
function psTextToHtml(txt){
  const lines=String(txt).split('\n');
  return lines.map(line=>{
    const div=document.createElement('div');
    div.textContent=line;               // 自动转义 & < > 等
    return div.innerHTML;
  }).join('<br>');
}

function psRenderAIPreview(nodes){
  PS.aiPreview=nodes;
  const body=$('psAIBody');
  const items=nodes.map((n,i)=>`
    <div class="psai-item">
      <label class="psai-item-head"><input type="checkbox" class="psai-chk" data-i="${i}" checked>
      <span class="psai-item-q">${escHtml(n.q||'无题')}</span></label>
      <div class="psai-item-a">${escHtml(n.a||'')}</div>
    </div>`).join('');
  body.innerHTML = `
    <div class="psai-tip">AI 建议的新节点群（勾选要采纳的）：</div>
    ${items}
    <div class="psai-adopt">
      <button class="minibtn" id="psAIAdopt">✓ 采纳选中，建成新节点</button>
      <button class="minibtn" id="psAIDiscard">丢弃</button>
    </div>`;
  $('psAIAdopt').onclick=()=>{
    const chosen=[...body.querySelectorAll('.psai-chk')].filter(c=>c.checked).map(c=>PS.aiPreview[+c.dataset.i]);
    if(!chosen.length){ toast('没有勾选任何节点'); return; }
    const mother = (PS.aiScope && PS.aiScope.length===1) ? PS.aiScope[0]
                 : (PS.aiScope && PS.aiScope.length ? PS.aiScope[0] : null);
    const mn = mother ? psNode(mother) : null;
    // 采纳：建成真节点，围绕母节点（或屏幕中心）散布
    const wrap=$('psGraph'); const W=wrap.clientWidth||360, H=wrap.clientHeight||420;
    const cx = mn ? mn.x : (W/2-PS.view.x)/PS.view.scale;
    const cy = mn ? mn.y+260 : (H/2-PS.view.y)/PS.view.scale;
    const newIds=[];
    const R = Math.max(230, chosen.length*70);
    chosen.forEach((nd,i)=>{
      const id='n'+uid();
      const ang=(i/chosen.length)*Math.PI*2;
      S.psNodes[id]={ q:nd.q||'AI节点', a:psTextToHtml(nd.a||''), pub:false, ct:Date.now(),
        x:cx+Math.cos(ang)*R, y:cy+Math.sin(ang)*R, view:'card', color:'#9B59B6',
        cw:240, ch:200 };
      newIds.push(id);
    });
    S.psGroups=S.psGroups||[];
    if(chosen.length>1){
      // 多个节点 → 打组 → 组连母节点（母→组）
      const gi=S.psGroups.length;
      S.psGroups.push({name:'AI 生成', ids:newIds});
      if(mother){ S.psLinks.push({from:mother, toG:gi, fs:'bottom', ts:'top'}); }
    } else {
      // 单个节点 → 不打组 → 直接连母节点（母→新）
      if(mother){ S.psLinks.push({from:mother, to:newIds[0], fs:'bottom', ts:'top'}); }
    }
    psSave(); renderPSGraph();
    toast(`已采纳 ${chosen.length} 个新节点`);
    closePSAI();
  };
  $('psAIDiscard').onclick=()=>{ PS.aiPreview=null; closePSAI(); };
}


function psNewNode(){
  const id='n'+uid();
  const wrap=$('psGraph');
  const W=wrap.clientWidth||360, H=wrap.clientHeight||500;
  // 落在当前视图中心（考虑已平移/缩放），再随机散开一点
  const cx=(W/2-PS.view.x)/PS.view.scale + (Math.random()*80-40);
  const cy=(H/2-PS.view.y)/PS.view.scale + (Math.random()*80-40);
  S.psNodes[id]={ q:'新节点', a:'', pub:false, ct:Date.now(), x:cx, y:cy, view:'graph' };
  psSave();
  renderPSGraph();
  psOpenCard(id);
}

function psDeleteNode(id){
  delete S.psNodes[id];
  S.psLinks = (S.psLinks||[]).filter(l=>l.from!==id && l.to!==id);
  // 从所有组里移除该节点
  (S.psGroups||[]).forEach(g=>{ g.ids=(g.ids||[]).filter(x=>x!==id); });
  S.psGroups=(S.psGroups||[]).filter(g=>(g.ids||[]).length>0);
  psSave();
}

/* ── 图谱渲染（SVG）── */
function renderPSGraph(){
  const wrap=$('psGraph');
  const W=wrap.clientWidth||360, H=wrap.clientHeight||420;
  // 隐藏组里的节点不显示
  const hiddenIds=new Set();
  (S.psGroups||[]).forEach(g=>{ if(g.hidden) (g.ids||[]).forEach(id=>hiddenIds.add(id)); });
  const nodes=psAllNodes().filter(n=>!hiddenIds.has(n.id));
  const links=S.psLinks||[];
  const groups=S.psGroups||[];
  const nmap={}; nodes.forEach(n=>nmap[n.id]=n);
  const V=PS.view;
  const PINK='#FF5CA8';
  const inkColor = PS.light ? '#232936' : '#D8DCE6';   // 圆点标题色随模式
  const nodeColor=(n)=> n.color || '#4A90E2';
  const isCard=(n)=> n.view==='card';
  // 搜索命中判断
  const kw=(PS.search||'').trim().toLowerCase();
  const hit=(n)=>{ if(!kw) return false;
    const q=(n.q||'').toLowerCase();
    const a=(n.a||'').replace(/<[^>]+>/g,'').toLowerCase();
    return q.includes(kw)||a.includes(kw); };

  const deg={};
  links.forEach(l=>{ deg[l.from]=(deg[l.from]||0)+1; deg[l.to]=(deg[l.to]||0)+1; });

  function cardBox(n){
    const cw=n.cw||166, ch=n.ch||120;
    return {cw,ch,x:n.x-cw/2,y:n.y-ch/2};
  }
  function autoR(n){ return Math.min(12+(deg[n.id]||0)*2.4, 34); }
  function anchorOf(n, side){
    if(isCard(n)){
      const b=cardBox(n);
      if(side==='top')    return {x:n.x, y:b.y};
      if(side==='bottom') return {x:n.x, y:b.y+b.ch};
      if(side==='left')   return {x:b.x, y:n.y};
      if(side==='right')  return {x:b.x+b.cw, y:n.y};
    }
    return {x:n.x, y:n.y};
  }

  const selEndIds=new Set();
  if(PS.selLink!=null && links[PS.selLink]){ selEndIds.add(links[PS.selLink].from); selEndIds.add(links[PS.selLink].to); }

  // ── 组框（在最底层）──
  let groupSvg='';
  const groupBoxes=[];   // gi -> {minx,miny,maxx,maxy}
  const gFont = Math.max(12, Math.min(24, 12/Math.max(V.scale,0.35)));  // 组名反向补偿
  groups.forEach((g,gi)=>{
    if(g.hidden){ groupBoxes[gi]=null; return; }
    const ids=(g.ids||[]).filter(id=>nmap[id]);
    if(!ids.length){ groupBoxes[gi]=null; return; }
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    ids.forEach(id=>{
      const n=nmap[id];
      let bx,by,bw,bh;
      if(isCard(n)){ const b=cardBox(n); bx=b.x;by=b.y;bw=b.cw;bh=b.ch; }
      else { const r=autoR(n); bx=n.x-r;by=n.y-r;bw=2*r;bh=2*r+22; }
      minx=Math.min(minx,bx); miny=Math.min(miny,by);
      maxx=Math.max(maxx,bx+bw); maxy=Math.max(maxy,by+bh);
    });
    const pad=16;
    minx-=pad;miny-=pad+16;maxx+=pad;maxy+=pad;
    groupBoxes[gi]={minx,miny,maxx,maxy};
    const gcx=(minx+maxx)/2, gcy=(miny+maxy)/2;
    // 组四边连接点
    const gdots=[
      {side:'top',cx:gcx,cy:miny},{side:'bottom',cx:gcx,cy:maxy},
      {side:'left',cx:minx,cy:gcy},{side:'right',cx:maxx,cy:gcy}
    ].map(d=>`<circle class="psgport" data-gi="${gi}" data-side="${d.side}" cx="${d.cx}" cy="${d.cy}" r="9" fill="transparent" style="cursor:crosshair"/><circle cx="${d.cx}" cy="${d.cy}" r="6" fill="#fff" stroke="#4A90E2" stroke-width="2" style="pointer-events:none"/>`).join('');
    groupSvg+=`<g class="psgroup" data-gi="${gi}">
      <rect x="${minx}" y="${miny}" width="${maxx-minx}" height="${maxy-miny}" rx="12"
        fill="rgba(74,144,226,0.06)" stroke="#4A90E2" stroke-width="1.4" stroke-dasharray="8 5" style="cursor:move"/>
      <rect class="psgrouptag" data-gi="${gi}" x="${minx}" y="${miny-(gFont-12)}" width="${Math.max((g.name||'组').length*(gFont*1.05)+40,80)}" height="${gFont+10}" rx="6" fill="#4A90E2" style="cursor:pointer"/>
      <text x="${minx+8}" y="${miny+gFont*0.75-(gFont-12)}" font-size="${gFont}" fill="#fff" style="pointer-events:none">${escHtml(g.name||'组')} ✕</text>
      ${gdots}
    </g>`;
  });
  PS._groupBoxes=groupBoxes;

  // ── 连线 ──
  let lineSvg='';
  // 组端点锚点
  function groupAnchor(gi, side){
    const gb=groupBoxes[gi]; if(!gb) return null;
    const gcx=(gb.minx+gb.maxx)/2, gcy=(gb.miny+gb.maxy)/2;
    if(side==='top') return {x:gcx,y:gb.miny};
    if(side==='bottom') return {x:gcx,y:gb.maxy};
    if(side==='left') return {x:gb.minx,y:gcy};
    if(side==='right') return {x:gb.maxx,y:gcy};
    return {x:gcx,y:gcy};
  }
  function endFrom(l){ return (l.fromG!=null)? groupAnchor(l.fromG,l.fs) : (nmap[l.from]?anchorOf(nmap[l.from],l.fs):null); }
  function endTo(l){ return (l.toG!=null)? groupAnchor(l.toG,l.ts) : (nmap[l.to]?anchorOf(nmap[l.to],l.ts):null); }

  links.forEach((l,li)=>{
    const pa=endFrom(l), pb=endTo(l);
    if(!pa||!pb) return;
    const sel = (li===PS.selLink);
    const stroke = sel ? PINK : '#8AA0C8';
    const sw = sel ? 2.6 : 1.6;
    const marker = sel ? 'url(#psArrowSel)' : 'url(#psArrow)';
    const dash = l.dashed ? 'stroke-dasharray="7 5"' : '';
    lineSvg+=`<line class="pslinkhit" data-index="${li}" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="transparent" stroke-width="16" style="cursor:pointer"/>`;
    lineSvg+=`<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${stroke}" stroke-width="${sw}" opacity="${sel?1:0.7}" ${dash} marker-end="${marker}" style="pointer-events:none"/>`;
    if(l.note){
      const mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2;
      lineSvg+=`<rect x="${mx-l.note.length*3.6-4}" y="${my-9}" width="${l.note.length*7.2+8}" height="16" rx="4" fill="#0A0E1D" opacity="0.85" style="pointer-events:none"/>`;
      lineSvg+=`<text x="${mx}" y="${my+3}" text-anchor="middle" font-size="10" fill="${sel?PINK:'#C2C9D6'}" style="pointer-events:none">${escHtml(l.note)}</text>`;
    }
  });

  // 标题字号：缩小时反向补偿（scale<1 时字变相对大，范围 11~20）
  const titleFont = Math.max(11, Math.min(20, 11/Math.max(V.scale,0.35)));

  // ── 节点（逐个按自己的 view 渲染）──
  let nodeSvg='';
  nodes.forEach(n=>{
    const searchHit=hit(n);
    const selp = selEndIds.has(n.id);
    const inSel = PS.selNodes && PS.selNodes.has(n.id);
    if(!isCard(n)){
      // 圆点
      const r=autoR(n);
      const baseFill = nodeColor(n);
      const fill = (selp||searchHit) ? PINK : baseFill;
      const title=(n.q||'');
      const per=8, lines=[];
      for(let i=0;i<title.length;i+=per) lines.push(title.slice(i,i+per));
      if(!lines.length) lines.push('');
      const startY=n.y+r+titleFont+2;
      const tspans=lines.map((ln,i)=>`<tspan x="${n.x}" dy="${i===0?0:titleFont+2}">${escHtml(ln)}</tspan>`).join('');
      // 公开双同心圆：第二圈粗细 = 随半径自动、比之前粗一倍
      const ringW = Math.max(3, r*0.18*2);
      const pubRing = n.pub ? `<circle cx="${n.x}" cy="${n.y}" r="${r+ringW}" fill="none" stroke="${fill}" stroke-width="${ringW}" opacity="0.9"/>` : '';
      const selRing = inSel ? `<circle cx="${n.x}" cy="${n.y}" r="${r*1.35+6}" fill="none" stroke="${PINK}" stroke-width="${Math.max(1.5,r*0.12)}" stroke-dasharray="4 3"/>` : '';
      nodeSvg+=`<g class="psnode" data-id="${n.id}" style="cursor:pointer">
        ${selRing}${pubRing}
        <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${fill}" stroke="#fff" stroke-width="2"/>
        <text y="${startY}" text-anchor="middle" font-size="${titleFont}" fill="${inkColor}">${tspans}</text>
      </g>`;
    } else {
      // 卡片
      const b=cardBox(n); const {cw,ch,x,y}=b;
      const qLines = cw>=230?4:2;
      const col = nodeColor(n);
      const border = (selp||searchHit) ? PINK : col;
      const body=(n.a||'').trim();
      const roomy = ch>=140;
      const clampStyle = roomy ? '' : `-webkit-line-clamp:${Math.max(2,Math.floor((ch-40)/16))};`;
      const hs=12;
      const ringW=Math.max(4, 3*2);
      const pubStyle = n.pub ? `box-shadow:0 0 0 2px #1B2540, 0 0 0 ${2+ringW}px ${border};` : '';
      const selPad=Math.max(8, Math.min(cw,ch)*0.06);
      const selBox = inSel ? `<rect x="${x-selPad}" y="${y-selPad}" width="${cw+selPad*2}" height="${ch+selPad*2}" rx="12" fill="none" stroke="${PINK}" stroke-width="2" stroke-dasharray="5 4"/>` : '';
      const dots=[
        {side:'top',    cx:n.x,      cy:y},
        {side:'bottom', cx:n.x,      cy:y+ch},
        {side:'left',   cx:x,        cy:n.y},
        {side:'right',  cx:x+cw,     cy:n.y}
      ].map(d=>`<circle class="psport" data-id="${n.id}" data-side="${d.side}" cx="${d.cx}" cy="${d.cy}" r="9" fill="transparent" style="cursor:crosshair"/><circle cx="${d.cx}" cy="${d.cy}" r="6" fill="#fff" stroke="${border}" stroke-width="2" style="pointer-events:none"/>`).join('');
      nodeSvg+=`<g class="psnode" data-id="${n.id}" style="cursor:pointer">
        ${selBox}
        <foreignObject x="${x}" y="${y}" width="${cw}" height="${ch}">
          <div xmlns="http://www.w3.org/1999/xhtml" class="pscard-node" style="border-color:${border};${pubStyle}">
            <div class="pscn-q" style="-webkit-line-clamp:${qLines}">${escHtml(n.q||'无题')}</div>
            <div class="pscn-a${roomy?' full':''}" style="${clampStyle}">${body||'<span style="color:#9AA3B2">（空）</span>'}</div>
          </div>
        </foreignObject>
        ${dots}
        <rect class="pshandle" data-id="${n.id}" x="${x+cw-hs}" y="${y+ch-hs}" width="${hs}" height="${hs}" rx="3"
          fill="${border}" stroke="#fff" stroke-width="1.5" style="cursor:nwse-resize"/>
      </g>`;
    }
  });

  let tempLine='';
  if(PS.linking){
    tempLine=`<line x1="${PS.linking.x0}" y1="${PS.linking.y0}" x2="${PS.linking.x1}" y2="${PS.linking.y1}" stroke="#FFB454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#psArrow)"/>`;
  }
  // 框选矩形
  let boxSvg='';
  if(PS.boxSel){
    const b=PS.boxSel;
    const x=Math.min(b.x0,b.x1), y=Math.min(b.y0,b.y1);
    boxSvg=`<rect x="${x}" y="${y}" width="${Math.abs(b.x1-b.x0)}" height="${Math.abs(b.y1-b.y0)}" fill="rgba(255,92,168,0.1)" stroke="${PINK}" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  }
  let guideSvg='';
  if(PS.guides){
    PS.guides.forEach(g=>{
      if(g.type==='v') guideSvg+=`<line x1="${g.at}" y1="${-1e4}" x2="${g.at}" y2="${1e4}" stroke="#FF5CA8" stroke-width="1" opacity="0.8"/>`;
      else guideSvg+=`<line x1="${-1e4}" y1="${g.at}" x2="${1e4}" y2="${g.at}" stroke="#FF5CA8" stroke-width="1" opacity="0.8"/>`;
    });
  }

  wrap.innerHTML=`<svg id="psSvg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
    style="touch-action:none;display:block">
    <defs>
      <marker id="psArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#8AA0C8"/>
      </marker>
      <marker id="psArrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#FF5CA8"/>
      </marker>
    </defs>
    <g transform="translate(${V.x},${V.y}) scale(${V.scale})">
      ${groupSvg}${guideSvg}${lineSvg}${tempLine}${nodeSvg}${boxSvg}
    </g></svg>`;
  bindPSGraphInput();
  if(typeof psShowTools==='function') psShowTools();
}

/* ── 图谱交互：拖节点 / 单指平移 / 双指缩放（真实像素坐标）── */
function bindPSGraphInput(){
  const svg=$('psSvg');
  if(!svg) return;
  const pt=(cx,cy)=>{ const r=svg.getBoundingClientRect(); return {x:cx-r.left,y:cy-r.top}; };
  const toContent=(p)=>({x:(p.x-PS.view.x)/PS.view.scale, y:(p.y-PS.view.y)/PS.view.scale});
  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const midClient=(t)=>({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});

  // 连线点击选中 / 双击加附注（桌面 dblclick + 手机双击检测）
  svg.querySelectorAll('.pslinkhit').forEach(ln=>{
    const idx=+ln.dataset.index;
    const addNote=async ()=>{
      const l=(S.psLinks||[])[idx]; if(!l) return;
      const note=await uiPrompt('连线附注文字','给这条连线加个说明', l.note||'');
      if(note===null) return;
      l.note=note.trim(); save(); PS.selLink=idx; renderPSGraph();
    };
    ln.addEventListener('click',(e)=>{
      e.stopPropagation();
      const now=Date.now();
      if(PS._lastLinkTap && PS._lastLinkTap.idx===idx && now-PS._lastLinkTap.t<350){
        PS._lastLinkTap=null; addNote(); return;
      }
      PS._lastLinkTap={idx, t:now};
      PS.selLink=idx; renderPSGraph();
    });
    ln.addEventListener('dblclick',(e)=>{ e.stopPropagation(); addNote(); });
  });

  // 组标签点击 = 取消打组
  svg.querySelectorAll('.psgrouptag').forEach(tag=>{
    const gi=+tag.dataset.gi;
    tag.addEventListener('click',(e)=>{
      e.stopPropagation();
      const now=Date.now();
      // 双击组标签 = 重命名
      if(tag._lastTap && now-tag._lastTap<350){
        tag._lastTap=0;
        const g=(S.psGroups||[])[gi]; if(!g) return;
        uiPrompt('组名','', g.name||'').then(nm=>{ if(nm!==null){ g.name=nm.trim()||'组'; save(); renderPSGraph(); } });
        return;
      }
      tag._lastTap=now;
      // 单击 = 选中组，弹工具条
      PS.selGroup=gi; PS.selNodes=null;
      renderPSGraph();
    });
  });

  // 组框拖动 = 整组移动
  svg.querySelectorAll('.psgroup').forEach(gEl=>{
    const gi=+gEl.dataset.gi;
    const gdown=(cx,cy,ev)=>{
      if(ev.target.classList.contains('psgrouptag')) return;
      ev.stopPropagation();
      if(ev.touches && ev.touches.length>1) return;
      const p=pt(cx,cy);
      PS.groupDrag={ gi, x:p.x, y:p.y, moved:false };
    };
    gEl.addEventListener('touchstart',e=>{ if(e.touches.length===1) gdown(e.touches[0].clientX,e.touches[0].clientY,e); },{passive:false});
    gEl.addEventListener('mousedown',e=>gdown(e.clientX,e.clientY,e));
  });

  svg.querySelectorAll('.psport').forEach(pdot=>{
    const id=pdot.dataset.id, side=pdot.dataset.side;
    const pdown=(cx,cy,ev)=>{
      ev.stopPropagation(); ev.preventDefault();
      const p=pt(cx,cy); const c=toContent(p);
      PS.linking={ from:id, fs:side, x0:+pdot.getAttribute('cx'), y0:+pdot.getAttribute('cy'), x1:c.x, y1:c.y };
    };
    pdot.addEventListener('touchstart',e=>{ if(e.touches.length===1) pdown(e.touches[0].clientX,e.touches[0].clientY,e); },{passive:false});
    pdot.addEventListener('mousedown',e=>pdown(e.clientX,e.clientY,e));
  });

  // 组连接点：拖线（组作为端点）
  svg.querySelectorAll('.psgport').forEach(pdot=>{
    const gi=+pdot.dataset.gi, side=pdot.dataset.side;
    const pdown=(cx,cy,ev)=>{
      ev.stopPropagation(); ev.preventDefault();
      const p=pt(cx,cy); const c=toContent(p);
      PS.linking={ fromG:gi, fs:side, x0:+pdot.getAttribute('cx'), y0:+pdot.getAttribute('cy'), x1:c.x, y1:c.y };
    };
    pdot.addEventListener('touchstart',e=>{ if(e.touches.length===1) pdown(e.touches[0].clientX,e.touches[0].clientY,e); },{passive:false});
    pdot.addEventListener('mousedown',e=>pdown(e.clientX,e.clientY,e));
  });

  svg.querySelectorAll('.pshandle').forEach(h=>{
    const id=h.dataset.id;
    const hdown=(cx,cy,ev)=>{
      ev.stopPropagation(); ev.preventDefault();
      const n=psNode(id); if(!n) return;
      const p=pt(cx,cy);
      PS.resize={ id, x:p.x, y:p.y, cw:(n.cw||166), ch:(n.ch||120) };
    };
    h.addEventListener('touchstart',e=>{ if(e.touches.length===1) hdown(e.touches[0].clientX,e.touches[0].clientY,e); },{passive:false});
    h.addEventListener('mousedown',e=>hdown(e.clientX,e.clientY,e));
  });

  svg.querySelectorAll('.psnode').forEach(g=>{
    const id=g.dataset.id;
    const down=(cx,cy,ev)=>{
      ev.stopPropagation();
      if(ev.touches && ev.touches.length>1) return;
      if(PS.resize || PS.linking) return;
      // Shift+点击 = 多选（网页版）
      if(ev.shiftKey){
        ev.preventDefault();
        if(!PS.selNodes) PS.selNodes=new Set();
        if(PS.selNodes.has(id)) PS.selNodes.delete(id); else PS.selNodes.add(id);
        if(!PS.selNodes.size) PS.selNodes=null;
        renderPSGraph();
        return;
      }
      const p=pt(cx,cy);
      // 若按下的节点属于当前选中的组 → 整组拖动
      if(PS.selGroup!=null){
        const grp=(S.psGroups||[])[PS.selGroup];
        if(grp && (grp.ids||[]).includes(id)){
          PS.groupDrag={ gi:PS.selGroup, x:p.x, y:p.y, moved:false };
          return;
        }
      }
      // 若按下的节点在多选集合里 → 一起拖动这些节点
      if(PS.selNodes && PS.selNodes.has(id)){
        PS.multiDrag={ ids:[...PS.selNodes], x:p.x, y:p.y, moved:false };
        return;
      }
      PS.drag={id, x:p.x, y:p.y, moved:false};
    };
    g.addEventListener('touchstart',e=>{ if(e.touches.length===1) down(e.touches[0].clientX,e.touches[0].clientY,e); },{passive:false});
    g.addEventListener('mousedown',e=>down(e.clientX,e.clientY,e));
  });

  function computeGuides(n){
    const TH=6/PS.view.scale; const guides=[];
    const others=psAllNodes().filter(o=>o.id!==n.id);
    for(const o of others){
      if(Math.abs(o.x-n.x)<TH){ n.x=o.x; guides.push({type:'v',at:o.x}); }
      if(Math.abs(o.y-n.y)<TH){ n.y=o.y; guides.push({type:'h',at:o.y}); }
    }
    PS.guides=guides.length?guides:null;
  }

  const move=(e)=>{
    const touches=e.touches;
    if(touches && touches.length===2){
      e.preventDefault();
      PS.drag=null; PS.panLast=null; PS.linking=null; PS.boxSel=null; PS.groupDrag=null; PS.multiDrag=null;
      const d=dist(touches), mc=midClient(touches);
      const rect=svg.getBoundingClientRect();
      const mx=mc.x-rect.left, my=mc.y-rect.top;
      if(PS.pinch){
        const ns=Math.min(Math.max(PS.view.scale*(d/PS.pinch.d),0.3),4);
        PS.view.x = mx - (mx-PS.view.x)*(ns/PS.view.scale);
        PS.view.y = my - (my-PS.view.y)*(ns/PS.view.scale);
        PS.view.scale=ns;
        renderPSGraph();
      }
      PS.pinch={d};
      return;
    }
    const cx=touches?touches[0].clientX:e.clientX;
    const cy=touches?touches[0].clientY:e.clientY;
    const p=pt(cx,cy);
    if(PS.linking){
      if(e.cancelable) e.preventDefault();
      const c=toContent(p); PS.linking.x1=c.x; PS.linking.y1=c.y; renderPSGraph(); return;
    }
    if(PS.boxSel){
      if(e.cancelable) e.preventDefault();
      const c=toContent(p); PS.boxSel.x1=c.x; PS.boxSel.y1=c.y; renderPSGraph(); return;
    }
    if(PS.groupDrag){
      if(e.cancelable) e.preventDefault();
      const g=(S.psGroups||[])[PS.groupDrag.gi];
      if(g){
        const dx=(p.x-PS.groupDrag.x)/PS.view.scale, dy=(p.y-PS.groupDrag.y)/PS.view.scale;
        (g.ids||[]).forEach(id=>{ const n=psNode(id); if(n){ n.x+=dx; n.y+=dy; } });
        PS.groupDrag.x=p.x; PS.groupDrag.y=p.y; PS.groupDrag.moved=true; renderPSGraph(); psShowTools();
      }
      return;
    }
    if(PS.multiDrag){
      if(e.cancelable) e.preventDefault();
      const dx=(p.x-PS.multiDrag.x)/PS.view.scale, dy=(p.y-PS.multiDrag.y)/PS.view.scale;
      (PS.multiDrag.ids||[]).forEach(id=>{ const n=psNode(id); if(n){ n.x+=dx; n.y+=dy; } });
      PS.multiDrag.x=p.x; PS.multiDrag.y=p.y; PS.multiDrag.moved=true; renderPSGraph(); psShowTools();
      return;
    }
    if(PS.resize){
      if(e.cancelable) e.preventDefault();
      const n=psNode(PS.resize.id);
      if(n){ n.cw=Math.max(120,PS.resize.cw+2*(p.x-PS.resize.x)/PS.view.scale);
             n.ch=Math.max(70, PS.resize.ch+2*(p.y-PS.resize.y)/PS.view.scale);
             PS.resize.moved=true; renderPSGraph(); }
      return;
    }
    if(PS.drag){
      if(e.cancelable) e.preventDefault();
      const n=psNode(PS.drag.id);
      if(n){ n.x+=(p.x-PS.drag.x)/PS.view.scale; n.y+=(p.y-PS.drag.y)/PS.view.scale;
             PS.drag.x=p.x; PS.drag.y=p.y; PS.drag.moved=true; computeGuides(n); renderPSGraph(); }
    } else if(PS.panLast){
      if(e.cancelable) e.preventDefault();
      PS.view.x+=(p.x-PS.panLast.x); PS.view.y+=(p.y-PS.panLast.y); PS.panLast=p; renderPSGraph();
    }
  };

  function hitPort(clientX,clientY){
    const el=document.elementFromPoint(clientX,clientY);
    if(el && el.classList && el.classList.contains('psport')) return {id:el.dataset.id, side:el.dataset.side};
    if(el && el.classList && el.classList.contains('psgport')) return {gi:+el.dataset.gi, side:el.dataset.side};
    let g=el; while(g && g!==svg){ if(g.classList && g.classList.contains('psnode')) return {id:g.dataset.id, side:null}; g=g.parentNode; }
    return null;
  }

  // 框选完成 → 命中的节点存进临时选中集合 PS.selNodes，
  // 弹出工具条（删除/调色/聚焦/打组）；不建组、不弹命名框。
  function finishBoxSelect(){
    const b=PS.boxSel; PS.boxSel=null;
    if(!b){ renderPSGraph(); return; }
    const x0=Math.min(b.x0,b.x1),x1=Math.max(b.x0,b.x1),y0=Math.min(b.y0,b.y1),y1=Math.max(b.y0,b.y1);
    if(Math.abs(x1-x0)<12 && Math.abs(y1-y0)<12){ PS.selNodes=null; PS.selGroup=null; renderPSGraph(); psShowTools(); return; }
    const sel=new Set();
    psAllNodes().forEach(n=>{ if(n.x>=x0&&n.x<=x1&&n.y>=y0&&n.y<=y1) sel.add(n.id); });
    PS.selNodes = sel.size?sel:null;
    PS.selGroup = null;
    renderPSGraph();
    psShowTools();
  }

  const up=(e)=>{
    if(PS.linking){
      const t=(e.changedTouches&&e.changedTouches[0])||e;
      const hit=hitPort(t.clientX,t.clientY);
      const L=PS.linking; PS.linking=null;
      if(hit){
        // 起点：节点L.from 或 组L.fromG；终点：hit.id 或 hit.gi
        const startNode=L.from, startGroup=L.fromG;
        const endNode=hit.id, endGroup=hit.gi;
        // 不能自己连自己
        const sameNode = (startNode!=null && endNode===startNode);
        const sameGroup = (startGroup!=null && endGroup===startGroup);
        if(!sameNode && !sameGroup && (endNode!=null || endGroup!=null)){
          const link={ fs:L.fs, ts:hit.side||'top' };
          if(startGroup!=null) link.fromG=startGroup; else link.from=startNode;
          if(endGroup!=null) link.toG=endGroup; else link.to=endNode;
          // 去重
          const dup=(S.psLinks||[]).some(l=> l.from===link.from && l.to===link.to && l.fromG===link.fromG && l.toG===link.toG);
          if(!dup){ S.psLinks.push(link); psSave(); }
        }
      }
      renderPSGraph(); PS.panLast=null; if(!e.touches||e.touches.length<2) PS.pinch=null; return;
    }
    if(PS.boxSel){ finishBoxSelect(); PS.panLast=null; if(!e.touches||e.touches.length<2) PS.pinch=null; return; }
    if(PS.groupDrag){ const m=PS.groupDrag.moved; PS.groupDrag=null; if(m) psSave(); psShowTools(); PS.panLast=null; if(!e.touches||e.touches.length<2) PS.pinch=null; return; }
    if(PS.multiDrag){ const m=PS.multiDrag.moved; PS.multiDrag=null; if(m) psSave(); psShowTools(); PS.panLast=null; if(!e.touches||e.touches.length<2) PS.pinch=null; return; }
    if(PS.resize){ const m=PS.resize.moved; PS.resize=null; if(m) psSave(); PS.panLast=null; if(!e.touches||e.touches.length<2) PS.pinch=null; return; }
    if(PS.drag){ const {moved,id}=PS.drag; PS.drag=null; PS.guides=null; if(moved){ psSave(); renderPSGraph(); } else psOpenCard(id); }
    PS.panLast=null; if(!e.touches||e.touches.length<2) PS.pinch=null;
  };

  // 空白按下：网页 Ctrl+左键=平移，普通左键=框选；手机长按=框选、单指=平移
  let longPressTimer=null;
  const bgDown=(cx,cy,e)=>{
    const tag=e.target.tagName;
    const onBlank = (e.target===svg || tag==='svg' || tag==='g' || tag==='rect'&&e.target.getAttribute('fill')&&e.target.getAttribute('fill').indexOf('rgba')<0);
    const blank = (e.target===svg || tag==='svg' || tag==='g');
    if(!blank) return;
    if(PS.selLink!=null){ PS.selLink=null; }
    if(PS.selNodes){ PS.selNodes=null; }
    if(PS.selGroup!=null){ PS.selGroup=null; }
    psShowTools();
    const p=pt(cx,cy); const c=toContent(p);
    const isMouse = e.type==='mousedown';
    if(isMouse){
      if(e.ctrlKey){ PS.panLast=p; }        // Ctrl+左键 = 平移
      else { PS.boxSel={x0:c.x,y0:c.y,x1:c.x,y1:c.y}; }  // 左键 = 框选
      renderPSGraph();
    } else {
      // 手机：单指默认平移；长按 350ms 转框选
      PS.panLast=p;
      longPressTimer=setTimeout(()=>{ PS.panLast=null; PS.boxSel={x0:c.x,y0:c.y,x1:c.x,y1:c.y}; renderPSGraph(); },350);
    }
  };
  const clearLP=()=>{ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; } };

  svg.addEventListener('touchstart',e=>{
    if(e.touches.length===2){ PS.pinch={d:dist(e.touches)}; PS.drag=null; PS.panLast=null; PS.linking=null; PS.boxSel=null; clearLP(); }
    else if(e.touches.length===1){ bgDown(e.touches[0].clientX,e.touches[0].clientY,e); }
  },{passive:false});
  svg.addEventListener('mousedown',e=>bgDown(e.clientX,e.clientY,e));
  svg.addEventListener('touchmove',e=>{ if(PS.panLast||PS.boxSel) clearLP(); move(e); },{passive:false});
  svg.addEventListener('mousemove',move);
  // 统一双击建节点：记录上次抬手的时间和位置，350ms 内同位置再抬手一次 = 建节点
  function tryDblCreate(clientX,clientY){
    // 判断是否在空白处（svg / 外层g / 框选矩形都算空白）
    const el=document.elementFromPoint(clientX,clientY);
    const tag=el&&el.tagName;
    const blank = (el===svg || tag==='svg' || tag==='g' || (tag==='rect' && el.getAttribute('fill') && el.getAttribute('fill').indexOf('rgba')>=0));
    if(!blank) { PS._lastTap=null; return false; }
    const now=Date.now();
    if(PS._lastTap && now-PS._lastTap.t<350 && Math.hypot(clientX-PS._lastTap.x, clientY-PS._lastTap.y)<30){
      PS._lastTap=null;
      PS.boxSel=null; PS.panLast=null;
      const p=pt(clientX,clientY); const c=toContent(p);
      const id='n'+uid();
      S.psNodes[id]={ q:'新节点', a:'', pub:false, ct:Date.now(), x:c.x, y:c.y, view:'graph' };
      psSave(); renderPSGraph(); psOpenCard(id);
      return true;
    }
    PS._lastTap={t:now, x:clientX, y:clientY};
    return false;
  }
  svg.addEventListener('touchend',e=>{
    clearLP();
    const t=(e.changedTouches&&e.changedTouches[0]);
    if(t && !PS.drag && !PS.resize && !PS.linking && !PS.groupDrag){
      if(tryDblCreate(t.clientX,t.clientY)){ PS.boxSel=null; return; }
    }
    up(e);
  });
  svg.addEventListener('mouseup',e=>{
    // 桌面：先处理常规 up，再检测双击（不干扰框选/拖动）
    const wasBox=PS.boxSel, wasDrag=PS.drag, wasLink=PS.linking, wasResize=PS.resize;
    up(e);
    if(!wasDrag && !wasLink && !wasResize){
      tryDblCreate(e.clientX, e.clientY);
    }
  });

  svg.addEventListener('wheel',(e)=>{
    if(!e.ctrlKey) return;
    e.preventDefault();
    const p=pt(e.clientX,e.clientY);
    const factor=e.deltaY<0?1.1:1/1.1;
    const ns=Math.min(Math.max(PS.view.scale*factor,0.3),4);
    PS.view.x=p.x-(p.x-PS.view.x)*(ns/PS.view.scale);
    PS.view.y=p.y-(p.y-PS.view.y)*(ns/PS.view.scale);
    PS.view.scale=ns; renderPSGraph();
  },{passive:false});
}

/* ── 节点卡片编辑 ── */
function psOpenCard(id){
  const n=psNode(id);
  if(!n) return;
  PS.sel=id;
  const box=$('psCard');
  // 出链：从本节点出发的连线
  const outLinks=(S.psLinks||[]).map((l,i)=>({l,i})).filter(o=>o.l.from===id);
  const linkHtml=outLinks.map(o=>{
    const l=o.l, t=psNode(l.to);
    return `<span class="pslink" data-goto="${l.to}">🔗 → ${escHtml((t&&t.q)||'（已删）')}<b class="pslink-dash" data-li="${o.i}">${l.dashed?'虚线':'实线'}</b><b class="pslink-x" data-cut="${l.to}">✕</b></span>`;
  }).join('');
  box.innerHTML=`
    <div class="pscard-head">
      <input id="psQ" class="psq" value="${escHtml(n.q||'')}" placeholder="Q：这个节点是关于什么？">
      <button class="close" id="psCardClose">✕</button>
    </div>
    <div class="pstoolbar">
      <button class="minibtn" id="psBold"><b>B</b> 加粗</button>
      <button class="minibtn" id="psHi">🖍 高亮</button>
      <button class="minibtn" id="psMkNode">✚ 选中文字建新节点</button>
    </div>
    <div id="psA" class="psa" contenteditable="true" data-ph="A：在这里写内容。选中文字可加粗/高亮，或建成新节点。"></div>
    <div class="pscolor-row">节点颜色：<button class="pscolor-swatch" id="psColorBtn" style="background:${n.color||'#4A90E2'}"></button><button class="minibtn" id="psColorReset">恢复默认</button><span style="margin-left:auto">显示：</span><button class="minibtn" id="psViewToggle">${n.view==='card'?'🗂 卡片':'⚬ 圆点'}</button></div>
    <div class="pslinks">${linkHtml||'<span class="pstip">还没有连线。从卡片四边圆点拖出即可。</span>'}</div>
    <div class="pscard-ops">
      <button class="minibtn" id="psAI">✨ AI 优化</button>
      <label class="pspub"><input type="checkbox" id="psPub" ${n.pub?'checked':''}> 公开此节点</label>
      <button class="minibtn danger" id="psDel">删除</button>
    </div>`;
  $('psCardWrap').style.display='flex';

  const q=$('psQ'), a=$('psA');
  a.innerHTML = n.a||'';
  const persist=()=>{ n.q=q.value; n.a=a.innerHTML; save(); };
  q.oninput=persist;
  a.oninput=persist;
  // 粘贴强制纯文本：剥离外部来源的颜色/背景等内联样式，避免深色卡片上出现黑字
  a.addEventListener('paste',(ev)=>{
    ev.preventDefault();
    const text=(ev.clipboardData||window.clipboardData).getData('text/plain');
    // 保留纯文本的段落/换行/行首缩进，但剥离来源的颜色等样式
    // 每行：转义特殊字符 + 行首空格转 &nbsp; 保留缩进；行间用 <br>
    const html = text.split('\n').map(line=>{
      const div=document.createElement('div');
      div.textContent=line;
      let h=div.innerHTML;                       // 安全转义
      h=h.replace(/^(\s+)/, m=>'&nbsp;'.repeat(m.length));  // 保留行首缩进
      return h;
    }).join('<br>');
    // 用 execCommand('insertHTML') 插入，使这次粘贴进入浏览器原生撤销栈，
    // 从而在编辑框内可用 Ctrl+Z 撤销粘贴内容。
    a.focus();
    let inserted=false;
    try{ inserted=document.execCommand('insertHTML', false, html); }catch(_){ inserted=false; }
    if(!inserted){
      // 回退：仍手动插入（极少数不支持 execCommand 的环境）
      const sel=window.getSelection();
      if(sel && sel.rangeCount){
        const rng=sel.getRangeAt(0);
        rng.deleteContents();
        const frag=rng.createContextualFragment(html);
        rng.insertNode(frag);
        rng.collapse(false);
        sel.removeAllRanges(); sel.addRange(rng);
      } else {
        a.insertAdjacentHTML('beforeend', html);
      }
    }
    persist();
  });

  $('psCardClose').onclick=()=>{ persist(); psHistPush(); $('psCardWrap').style.display='none'; PS.sel=null; renderPSGraph(); };
  $('psPub').onchange=()=>{ n.pub=$('psPub').checked; save(); renderPSGraph(); };
  $('psDel').onclick=async ()=>{
    if(await uiConfirm('删除此节点？与它相连的线会一并消失')){
      psDeleteNode(id);
      $('psCardWrap').style.display='none'; PS.sel=null; renderPSGraph();
    }
  };
  $('psAI').onclick=()=>{ PS.aiScope=[id]; $('psAIScope').textContent='（针对当前节点）'; $('psAIBody').innerHTML='<div class="psai-tip">AI 将读取此节点内容。点快捷按钮或输入问题。</div>'; $('psAIWrap').style.display='flex'; };

  // 富文本：加粗 / 高亮（手动包裹标签，避免 execCommand 在部分 webview 里给加粗上色）
  // 切换式包裹：选区已在该标签内则移除，否则包裹
  const wrapSel=(tag)=>{
    a.focus();
    const s=window.getSelection();
    if(!s.rangeCount) return;
    const rng=s.getRangeAt(0);
    if(rng.collapsed || !a.contains(rng.commonAncestorContainer)) { toast('先选中一段文字'); return; }
    // 检查选区是否已被同类标签包裹 → 若是则取消
    let anc=rng.commonAncestorContainer;
    if(anc.nodeType===3) anc=anc.parentNode;
    const existing = anc.closest ? anc.closest(tag) : null;
    if(existing && a.contains(existing)){
      // 取消：用标签内容替换标签本身
      const parent=existing.parentNode;
      while(existing.firstChild) parent.insertBefore(existing.firstChild, existing);
      parent.removeChild(existing);
      parent.normalize();
      s.removeAllRanges();
      persist(); psHistPush();
      return;
    }
    // 包裹：先提取内容，剥掉其中已有的同类标签（避免嵌套/叠加），再包一层干净的
    const el=document.createElement(tag);
    try{
      const frag=rng.extractContents();
      // 去掉 frag 内部所有同名标签，保留其文字
      frag.querySelectorAll && frag.querySelectorAll(tag).forEach(inner=>{
        const par=inner.parentNode;
        while(inner.firstChild) par.insertBefore(inner.firstChild, inner);
        par.removeChild(inner);
      });
      el.appendChild(frag);
      rng.insertNode(el);
      el.parentNode && el.parentNode.normalize();
    }
    catch(err){ toast('这段不好加，换个选区试试'); return; }
    s.removeAllRanges();
    persist(); psHistPush();
  };
  // 按钮不抢焦点：mousedown/touchstart 时阻止默认，保住正文选区
  ['psBold','psHi','psMkNode'].forEach(bid=>{
    const b=$(bid); if(!b) return;
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  });
  $('psBold').onclick=()=>wrapSel('b');
  $('psHi').onclick=()=>wrapSel('mark');

  // 选中文字 → 建成新节点（自动连线 + 继承母节点颜色）
  $('psMkNode').onclick=()=>{
    const sel=String(window.getSelection()).trim();
    if(!sel){ toast('先在正文里选中一段文字'); return; }
    const nid='n'+uid();
    S.psNodes[nid]={ q:sel.slice(0,40), a:'', pub:false, ct:Date.now(),
      x:n.x+60+Math.random()*40, y:n.y+60+Math.random()*40,
      color:(n.color||'#4A90E2') };            // 继承母节点色系
    // 自动建立 母→新 连线
    S.psLinks.push({from:id, to:nid, fs:'right', ts:'left'});
    save(); renderPSGraph();
    toast('已建新节点「'+sel.slice(0,10)+'」并连线');
  };

  // 节点颜色自定义
  $('psColorBtn').onclick=async ()=>{
    const c=await uiColor('选择节点颜色', n.color||'#4A90E2');
    if(!c) return;
    n.color=c; save();
    $('psColorBtn').style.background=c;
    renderPSGraph();
  };
  $('psColorReset').onclick=()=>{
    delete n.color; save();
    $('psColorBtn').style.background='#4A90E2';
    renderPSGraph();
  };
  // 显示模式：卡片 / 圆点
  $('psViewToggle').onclick=()=>{
    n.view = n.view==='card' ? 'graph' : 'card';
    $('psViewToggle').textContent = n.view==='card' ? '🗂 卡片' : '⚬ 圆点';
    save(); renderPSGraph();
  };

  // 跳转 / 断开 / 虚实线
  box.querySelectorAll('.pslink').forEach(el=>{
    el.onclick=(ev)=>{ if(ev.target.classList.contains('pslink-x')||ev.target.classList.contains('pslink-dash')) return; psOpenCard(el.dataset.goto); };
  });
  box.querySelectorAll('.pslink-dash').forEach(d=>d.onclick=(ev)=>{
    ev.stopPropagation();
    const l=(S.psLinks||[])[+d.dataset.li]; if(!l) return;
    l.dashed=!l.dashed; save(); psOpenCard(id); renderPSGraph();
  });
  box.querySelectorAll('.pslink-x').forEach(x=>x.onclick=(ev)=>{
    ev.stopPropagation();
    const to=x.dataset.cut;
    S.psLinks=(S.psLinks||[]).filter(l=>!(l.from===id && l.to===to));
    save(); psOpenCard(id); renderPSGraph();
  });
}

$('psAdd').onclick=psNewNode;
$('psClose').onclick=closePS;
$('psSearch').oninput=(e)=>{
  PS.search=e.target.value;
  renderPSGraph();
  psSearchDropdown();
};
function psSearchDropdown(){
  const box=$('psSearchResults'); if(!box) return;
  const kw=(PS.search||'').trim().toLowerCase();
  if(!kw){ box.style.display='none'; box.innerHTML=''; return; }
  const hits=psAllNodes().filter(n=>{
    const q=(n.q||'').toLowerCase();
    const a=(n.a||'').replace(/<[^>]+>/g,'').toLowerCase();
    return q.includes(kw)||a.includes(kw);
  }).slice(0,12);
  if(!hits.length){ box.style.display='block'; box.innerHTML='<div class="pssr-empty">无匹配节点</div>'; return; }
  box.innerHTML=hits.map(n=>{
    const plain=(n.a||'').replace(/<[^>]+>/g,'');
    // 摘要：取含关键词附近的一段
    let snip=plain;
    const pos=plain.toLowerCase().indexOf(kw);
    if(pos>=0){ const s=Math.max(0,pos-15); snip=(s>0?'…':'')+plain.slice(s,s+50)+(plain.length>s+50?'…':''); }
    else snip=plain.slice(0,50);
    return `<div class="pssr-item" data-id="${n.id}"><div class="pssr-q">${escHtml(n.q||'无题')}</div><div class="pssr-a">${escHtml(snip||'（空）')}</div></div>`;
  }).join('');
  box.style.display='block';
  box.querySelectorAll('.pssr-item').forEach(el=>el.onclick=()=>psLocateNode(el.dataset.id));
}
// 定位到某节点：视图居中 + 选中高亮
function psLocateNode(id){
  const n=psNode(id); if(!n) return;
  const wrap=$('psGraph'); const W=wrap.clientWidth||360, H=wrap.clientHeight||420;
  PS.view.scale=Math.max(PS.view.scale,0.8);
  PS.view.x = W/2 - n.x*PS.view.scale;
  PS.view.y = H/2 - n.y*PS.view.scale;
  PS.selNodes=new Set([id]);
  $('psSearchResults').style.display='none';
  renderPSGraph();
}
$('psAIPanel').onclick=openPSAI;
$('psUndoBtn').onclick=psUndo;
$('psRedoBtn').onclick=psRedo;
$('psGroupMgrBtn').onclick=openGroupMgr;
$('psGMClose').onclick=closeGroupMgr;
$('psTheme').onclick=()=>{
  PS.light=!PS.light;
  localStorage.setItem('psLight', PS.light?'1':'0');
  $('psOverlay').classList.toggle('light', PS.light);
  $('psTheme').textContent = PS.light ? '🌙' : '☀️';
  renderPSGraph();
};
$('psAIClose').onclick=closePSAI;
$('psAISend').onclick=()=>{ const v=$('psAIText').value.trim(); if(!v){ toast('先输入问题'); return; } psAskAI(v); };
$('psAIText').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=$('psAIText').value.trim(); if(v) psAskAI(v); } });
document.querySelectorAll('.psai-quick [data-ai]').forEach(b=>b.onclick=()=>psAskAI(b.dataset.ai));
$('psAICount').onchange=(e)=>{ PS.aiCount=+e.target.value; };
</script>
